[package]
name = "ak500s-mac"
version = "0.3.1"
edition = "2021"
description = "DeepCool AK500S DIGITAL display driver for macOS (Hackintosh friendly)"
license = "MIT"

[dependencies]
hidapi = "2.6"
clap = { version = "4", features = ["derive"] }
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
strip = "symbols"
